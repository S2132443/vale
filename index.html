<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Surprise For You</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .hidden {
      display: none;
    }

    .surprise-button {
      font-size: 1.6rem;
      padding: 20px 48px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #e91e63, #c2185b);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(233, 30, 99, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: gentle-pulse 2s ease-in-out infinite;
    }

    .surprise-button:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 40px rgba(233, 30, 99, 0.55);
    }

    .surprise-button:focus-visible {
      outline: 3px solid #880e4f;
      outline-offset: 4px;
    }

    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* ── Surprise Section ── */
    #surprise-section {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .heart-svg {
      width: 70vmin;
      height: 63vmin;
    }

    .heart-path {
      fill: none;
      stroke: #e91e63;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .heart-path.drawing {
      animation: draw-heart 2s ease forwards;
    }

    .heart-path.filling {
      animation: fill-heart 0.8s ease forwards;
    }

    @keyframes draw-heart {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fill-heart {
      to {
        fill: #e91e63;
        fill-opacity: 1;
      }
    }

    #heart-image {
      transition: opacity 0.6s ease;
    }

    /* ── Status Text ── */
    #status-text {
      font-size: 2rem;
      font-weight: 700;
      color: #880e4f;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #880e4f;
      width: 0;
      transition: opacity 0.3s ease;
    }

    #status-text.typing {
      animation:
        typing 2s steps(26) forwards,
        blink-cursor 0.6s step-end infinite;
    }

    @keyframes typing {
      to {
        width: 26ch;
      }
    }

    @keyframes blink-cursor {
      50% { border-color: transparent; }
    }

    /* ── Answer Buttons ── */
    .answer-buttons {
      display: flex;
      gap: 24px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .answer-buttons.fade-in {
      animation: fade-in 0.6s ease forwards;
    }

    .answer-button {
      font-size: 1.3rem;
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .answer-button:focus-visible {
      outline: 3px solid #880e4f;
      outline-offset: 4px;
    }

    .yes-button {
      background: linear-gradient(135deg, #e91e63, #c2185b);
      color: #fff;
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.35);
    }

    .yes-button:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(233, 30, 99, 0.5);
    }

    .no-button {
      background: #fff;
      color: #c2185b;
      border: 2px solid #e91e63;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .no-button:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    @keyframes fade-in {
      to {
        opacity: 1;
      }
    }

    /* ── Volume Control ── */
    .volume-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.4;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .volume-control:hover {
      opacity: 0.9;
    }

    .volume-control label {
      font-size: 1rem;
      cursor: default;
    }

    .volume-control input[type="range"] {
      width: 80px;
      accent-color: #e91e63;
      cursor: pointer;
    }

    /* ── Floating Hearts Background ── */
    .floating-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -40px;
      font-size: 1.5rem;
      opacity: 0;
      animation: float-up linear infinite;
    }

    @keyframes float-up {
      0% {
        opacity: 0;
        transform: translateY(0) rotate(0deg);
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.7;
      }
      100% {
        opacity: 0;
        transform: translateY(-100vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <!-- Floating background hearts -->
  <div class="floating-hearts" id="floating-hearts"></div>

  <!-- Audio -->
  <audio id="background-music" loop>
    <source src="media/music/valentine_music.mp3" type="audio/mpeg">
  </audio>

  <!-- Main section: heart + question/response -->
  <section id="surprise-section">
    <svg class="heart-svg hidden" id="heart-svg" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="heart-clip">
          <path d="M100,170 C60,130 0,100 0,55 A55,55,0,0,1,100,30 A55,55,0,0,1,200,55 C200,100 140,130 100,170 Z" />
        </clipPath>
      </defs>
      <path
        id="heart-path"
        class="heart-path"
        d="M100,170 C60,130 0,100 0,55 A55,55,0,0,1,100,30 A55,55,0,0,1,200,55 C200,100 140,130 100,170 Z"
      />
      <image
        id="heart-image"
        clip-path="url(#heart-clip)"
        x="0" y="0"
        width="200" height="180"
        preserveAspectRatio="xMidYMid slice"
        opacity="0"
      />
    </svg>
    <p id="status-text" class="hidden" aria-live="polite">
      Will you be my Valentine ?
    </p>
    <div class="answer-buttons hidden" id="answer-buttons">
      <button class="answer-button yes-button" id="yes-button">Yes!</button>
      <button class="answer-button no-button" id="no-button">No</button>
    </div>
    <button class="surprise-button" id="surprise-button">
      Click here for surprise !!!
    </button>
  </section>

  <!-- Volume control (shown when music plays) -->
  <div id="volume-control" class="volume-control hidden">
    <label for="volume-slider">&#x1F508;</label>
    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.3">
  </div>

  <script>
    /* ── Element References ── */
    var surpriseSection = document.getElementById("surprise-section");
    var surpriseButton = document.getElementById("surprise-button");
    var heartSvg = document.getElementById("heart-svg");
    var heartPath = document.getElementById("heart-path");
    var heartImage = document.getElementById("heart-image");
    var statusText = document.getElementById("status-text");
    var answerButtons = document.getElementById("answer-buttons");
    var yesButton = document.getElementById("yes-button");
    var noButton = document.getElementById("no-button");
    var backgroundMusic = document.getElementById("background-music");
    var volumeControl = document.getElementById("volume-control");
    var volumeSlider = document.getElementById("volume-slider");

    /* ── App State ── */
    var appState = "QUESTION";
    var textChangeId = 0;
    var SUPPORTED_FORMATS = ["png", "jpg", "jpeg", "gif", "webp"];
    var ourPictureImages = [];
    var pleasePictureImages = [];
    var ourPictureIndex = 0;
    var pleasePictureIndex = 0;

    /* ── Try loading an image with supported formats ── */
    function tryImageFormats(folder, number) {
      return new Promise(function (resolve) {
        var i = 0;
        function tryNext() {
          if (i >= SUPPORTED_FORMATS.length) { resolve(null); return; }
          var path = "media/images/" + folder + "/" + number + "." + SUPPORTED_FORMATS[i];
          var img = new Image();
          img.onload = function () { resolve(path); };
          img.onerror = function () { i++; tryNext(); };
          img.src = path;
        }
        tryNext();
      });
    }

    /* ── Scan a folder for numbered images (1.png, 2.jpg, etc.) ── */
    function scanFolder(folder) {
      var found = [];
      function scanNext(number) {
        return tryImageFormats(folder, number).then(function (path) {
          if (path) {
            found.push(path);
            return scanNext(number + 1);
          }
          return found;
        });
      }
      return scanNext(1);
    }

    /* ── Get next image in sequence, looping back to start ── */
    function nextImage(images, indexName) {
      var idx;
      if (indexName === "our") {
        idx = ourPictureIndex;
        ourPictureIndex = (ourPictureIndex + 1) % images.length;
      } else {
        idx = pleasePictureIndex;
        pleasePictureIndex = (pleasePictureIndex + 1) % images.length;
      }
      return images[idx];
    }

    /* ── Pre-scan both folders on page load ── */
    scanFolder("our_picture").then(function (images) { ourPictureImages = images; });
    scanFolder("please_picture").then(function (images) { pleasePictureImages = images; });

    /* ── Utility Functions ── */
    function showElement(element) {
      element.classList.remove("hidden");
    }

    function hideElement(element) {
      element.classList.add("hidden");
    }

    function delay(ms) {
      return new Promise(function (resolve) {
        setTimeout(resolve, ms);
      });
    }

    /* ── Heart Drawing Animation ── */
    function animateHeartDrawing() {
      var totalLength = heartPath.getTotalLength();
      heartPath.style.strokeDasharray = totalLength;
      heartPath.style.strokeDashoffset = totalLength;
      heartPath.style.fillOpacity = "0";

      // Force reflow so the browser registers the initial state
      heartPath.getBoundingClientRect();

      heartPath.classList.add("drawing");

      return delay(2200).then(function () {
        heartPath.classList.add("filling");
        return delay(900);
      });
    }

    /* ── Show Typing Animation ── */
    function showTypingQuestion() {
      statusText.style.width = "0";
      statusText.classList.add("typing");
      return delay(2500);
    }

    /* ── Show Answer Buttons ── */
    function showAnswerButtons() {
      answerButtons.classList.add("fade-in");

      // After animation completes, switch to inline style so transitions work later
      setTimeout(function () {
        answerButtons.classList.remove("fade-in");
        answerButtons.style.opacity = "1";
      }, 600);
    }

    /* ── Update Status Text with Fade ── */
    function changeStatusText(newText) {
      var myId = ++textChangeId;
      statusText.style.opacity = "0";

      setTimeout(function () {
        if (myId !== textChangeId) return;
        statusText.textContent = newText;
        statusText.classList.remove("typing");
        statusText.style.width = "auto";
        statusText.style.borderRight = "none";
        statusText.style.overflow = "visible";
        statusText.style.opacity = "1";
      }, 300);
    }

    /* ── Typewriter Effect ── */
    function typeWriter(text, charSpeed) {
      return new Promise(function (resolve) {
        statusText.classList.remove("typing");
        statusText.textContent = "";
        statusText.style.width = "auto";
        statusText.style.whiteSpace = "nowrap";
        statusText.style.overflow = "visible";
        statusText.style.borderRight = "3px solid #880e4f";
        statusText.style.opacity = "1";

        var i = 0;
        function type() {
          if (i < text.length) {
            statusText.textContent += text.charAt(i);
            i++;
            setTimeout(type, charSpeed);
          } else {
            resolve();
          }
        }
        type();
      });
    }

    /* ── Show Intro Sentence with Typewriter ── */
    function showIntroSentence(text, holdTime) {
      return typeWriter(text, 60).then(function () {
        return delay(holdTime);
      }).then(function () {
        statusText.style.opacity = "0";
        return delay(500);
      });
    }

    /* ── Surprise Sequence ── */
    function startSurprise() {
      hideElement(surpriseButton);
      showElement(heartSvg);
      showElement(statusText);

      backgroundMusic.volume = 0.3;
      backgroundMusic.play().catch(function () {
        // Autoplay blocked — music will not play, but animation continues
      });
      showElement(volumeControl);

      startFloatingHearts();

      animateHeartDrawing()
        .then(function () {
          return showIntroSentence("I was at work and I thought about you", 2000);
        })
        .then(function () {
          return showIntroSentence("Being away makes me miss you so muchh T.T", 2000);
        })
        .then(function () {
          return showIntroSentence("Which reminded me to ask you...", 2000);
        })
        .then(function () {
          return typeWriter("Will you be my Valentine ?", 80);
        })
        .then(function () {
          showElement(answerButtons);
          showAnswerButtons();
        });
    }

    /* ── Slideshow for "Yes" State ── */
    var slideshowTimer = null;

    function startSlideshow() {
      if (ourPictureImages.length <= 1) return;

      slideshowTimer = setInterval(function () {
        // Fade out
        heartImage.style.opacity = "0";

        setTimeout(function () {
          // Swap to next image, then fade in
          heartImage.setAttribute("href", nextImage(ourPictureImages, "our"));
          heartImage.style.opacity = "1";
        }, 600);
      }, 4000);
    }

    /* ── Handle "Yes" (Terminal State) ── */
    function handleYes() {
      appState = "YES";
      removeResetListeners();

      if (ourPictureImages.length > 0) {
        heartImage.setAttribute("href", nextImage(ourPictureImages, "our"));
        heartImage.style.opacity = "1";
        startSlideshow();
      }

      changeStatusText("I love youuuu <33");

      answerButtons.style.opacity = "0";
      answerButtons.style.pointerEvents = "none";
    }

    /* ── Handle "No" ── */
    function handleNo() {
      appState = "NO";

      if (pleasePictureImages.length > 0) {
        heartImage.setAttribute("href", nextImage(pleasePictureImages, "please"));
        heartImage.style.opacity = "1";
      }

      changeStatusText("Pleaseeee");

      delay(500).then(function () {
        if (appState === "NO") {
          addResetListeners();
        }
      });
    }

    /* ── Reset Back to Question ── */
    function resetQuestion() {
      if (appState !== "NO") return;
      appState = "QUESTION";
      removeResetListeners();

      heartImage.style.opacity = "0";

      changeStatusText("Will you be my Valentine ?");
    }

    /* ── Reset Listener Management ── */
    function addResetListeners() {
      document.addEventListener("click", resetQuestion);
      document.addEventListener("keydown", resetQuestion);
    }

    function removeResetListeners() {
      document.removeEventListener("click", resetQuestion);
      document.removeEventListener("keydown", resetQuestion);
    }

    /* ── Volume Control ── */
    volumeSlider.addEventListener("input", function () {
      backgroundMusic.volume = this.value;
    });

    // Prevent volume slider clicks from triggering the "No" state reset
    volumeControl.addEventListener("click", function (event) {
      event.stopPropagation();
    });

    /* ── Floating Hearts Background ── */
    function startFloatingHearts() {
      var container = document.getElementById("floating-hearts");
      var hearts = ["\u2764\uFE0F", "\uD83D\uDC93", "\uD83D\uDC97", "\uD83D\uDC96", "\uD83D\uDC95"];

      function createHeart() {
        var heart = document.createElement("span");
        heart.className = "floating-heart";
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + "%";
        heart.style.fontSize = (Math.random() * 1.5 + 0.8) + "rem";
        heart.style.animationDuration = (Math.random() * 4 + 5) + "s";
        heart.style.animationDelay = (Math.random() * 2) + "s";
        container.appendChild(heart);

        setTimeout(function () {
          if (heart.parentNode) {
            heart.parentNode.removeChild(heart);
          }
        }, 11000);
      }

      setInterval(createHeart, 600);

      for (var i = 0; i < 8; i++) {
        createHeart();
      }
    }

    /* ── Event Bindings ── */
    surpriseButton.addEventListener("click", startSurprise);

    yesButton.addEventListener("click", function (event) {
      event.stopPropagation();
      handleYes();
    });

    noButton.addEventListener("click", function (event) {
      event.stopPropagation();
      handleNo();
    });
  </script>

</body>
</html>
